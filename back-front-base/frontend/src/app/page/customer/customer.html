<div class="container mt-3">

  <div class="d-flex justify-content-between mb-3">
    <h3>Clienti</h3>

    <button class="btn btn-primary" (click)="openAdd()">
      + Nuovo cliente
    </button>
  </div>

  <table class="table table-striped">

    <thead>
      <tr>
        <th>Nominativo</th>
        <th>Via</th>
        <th>Comune</th>
        <th>Provincia</th>
        <th>Email</th>
        <th>Telefono</th>
        <th>Azioni</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let c of customers$ | async">

        <td>{{ c.nominativo }}</td>
        <td>{{ c.via }}</td>
        <td>{{ c.comune }}</td>
        <td>{{ c.provincia }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.telefono }}</td>

        <td>
          <button class="btn btn-sm btn-warning"
                  (click)="openEdit(c)">
            Modifica
          </button>

          <button class="btn btn-sm btn-danger"
                  (click)="delete(c._id)">
            Elimina
          </button>
        </td>

      </tr>
    </tbody>

  </table>
</div>
