<div class="page">

  <div class="header">
    <h1>Clienti</h1>

    <button class="btn btn-primary" (click)="openCreateModal()">
      + Nuovo cliente
    </button>
  </div>

  <div class="error" *ngIf="error">
    {{ error }}
  </div>

  <div class="table-container">

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>Telefono</th>
          <th>Azioni</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let c of customers">

          <td>{{ c.nome }} {{ c.cognome }}</td>
          <td>{{ c.email }}</td>
          <td>{{ c.telefono }}</td>

          <td class="actions">

            <button (click)="openEditModal(c)">
              Modifica
            </button>

            <button class="delete" (click)="delete(c._id!)">
              Elimina
            </button>

          </td>

        </tr>
      </tbody>

    </table>

  </div>

</div>
